architectury {
	common {
		clear()
		add(rootProject.enabledPlatforms.split(','))
	}
}

loom {
	accessWidenerPath = file("src/main/resources/merchantmarkers.accesswidener")
}

repositories {
}

dependencies {
	// We depend on Fabric Loader here to use the Fabric @Environment annotations,
	// which get remapped to the correct annotations on each platform.
	// Do NOT use other classes from Fabric Loader.
	modImplementation "net.fabricmc:fabric-loader:$rootProject.fabricLoaderVersion"

	modApi 'curse.maven:ftbchunks-314906:7701627'
	modApi 'curse.maven:ftblibrary-404465:7718926'
	modApi 'curse.maven:xaerominimap-263420:8849898'
	modApi group: 'info.journeymap', name: 'journeymap-api-common', version: "$rootProject.journeymapVersion-SNAPSHOT", changing: true
}
